# Deploys to Cloudflare whenever main changes, so the live site always
# matches main and nobody needs to deploy from their own machine.
#
# Runs the checks, applies database migrations to Neon, then builds and
# deploys the Worker (`pnpm cf:deploy`). One deploy at a time; a newer push
# waits for the running one rather than cancelling it mid-migration.
#
# Repository settings it needs (Settings -> Secrets and variables -> Actions):
#   secret   CLOUDFLARE_API_TOKEN   "Edit Cloudflare Workers" token for the account
#   secret   DATABASE_URL           the Neon connection string (as in .env.neon)
#   variable CLOUDFLARE_ACCOUNT_ID  the Cloudflare account ID
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://groupdesk.michael-e09.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Migrate, build and deploy
        run: pnpm cf:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
